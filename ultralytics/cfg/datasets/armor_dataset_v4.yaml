# Armor Plate Detection Dataset Configuration (v4)
# RoboMaster Armor Plate Detection with 12 classes
# For use with MobileNet backbone model

# Dataset paths
path: /media/nuc11/common/RM/RMCV/YOLO/data/radardataset/armor_dataset/armor_dataset_v4
train: images # train images (relative to 'path')
val: images # val images - same as train, will use autosplit

# Number of classes
nc: 12

# Class names (RoboMaster armor plates)
# Blue team: B1-B5, B7 (sentry)
# Red team: R1-R5, R7 (sentry)
names:
  0: B1
  1: B2
  2: B3
  3: B4
  4: B5
  5: B7
  6: R1
  7: R2
  8: R3
  9: R4
  10: R5
  11: R7
# Notes:
# - Dataset contains 31001 images
# - Label format: class_id x_center y_center width height (normalized)
# - Since train/val are the same path, use autosplit or manually split later
