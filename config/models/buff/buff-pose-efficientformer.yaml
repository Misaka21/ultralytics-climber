# Buff Pose Detection Model with EfficientFormer Backbone
# Pooling attention in the last stage captures global geometric relationships.
# Best for understanding 9-keypoint spatial layout (especially the R-mark orientation).
# TRT-friendly attention (avg_pool - x, no softmax).

# Parameters
nc: 2                           # r_target, b_target
kpt_shape: [9, 3]               # 9 keypoints (3 visible, 6 for next frame)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 512]          # nano
  s: [0.33, 0.50, 512]          # small
  m: [0.67, 0.75, 512]          # medium

# EfficientFormer backbone
backbone:
  # [from, repeats, module, args]
  # Stem: /4 (two 3x3 convs stride 2)
  - [-1, 1, EfficientFormerStem, [48]]                  # 0-P2/4

  # Stage 2: /8 (P3, conv blocks)
  - [-1, 3, EfficientFormerStage, [96, 2]]              # 1-P3/8

  # Stage 3: /16 (P4, conv blocks)
  - [-1, 2, EfficientFormerStage, [224, 2]]             # 2-P4/16

  # Stage 4: /32 (P5, with pooling attention)
  - [-1, 6, EfficientFormerStage, [448, 2, True]]       # 3-P5/32
  - [-1, 1, SPPF, [448, 5]]                             # 4

# Lightweight FPN head for pose estimation
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]                 # cat backbone P4
  - [-1, 2, C2f, [224]]                       # 7

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]                 # cat backbone P3
  - [-1, 2, C2f, [96]]                        # 10 (P3/8-small)

  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]                 # cat head P4
  - [-1, 2, C2f, [224]]                       # 13 (P4/16-medium)

  - [-1, 1, Conv, [224, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]                 # cat head P5
  - [-1, 2, C2f, [448]]                       # 16 (P5/32-large)

  - [[10, 13, 16], 1, Pose, [nc, kpt_shape]]  # Pose(P3, P4, P5)
