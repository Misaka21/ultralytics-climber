# Rune Pose Detection Model with MobileNetV3 Backbone
# For detecting rune targets with up to 8 keypoints

# Parameters
nc: 4  # number of classes (4 rune types)
kpt_shape: [8, 3]  # 8 keypoints, 3 dimensions (x, y, visibility)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 512]   # nano
  s: [0.33, 0.50, 512]   # small
  m: [0.67, 0.75, 384]   # medium

# MobileNetV3-based backbone
backbone:
  # [from, repeats, module, args]
  # Stem: 640 -> 320
  - [-1, 1, MobileNetV3Stem, [16]]  # 0-P1/2

  # Stage 1: 320 -> 160
  - [-1, 1, MobileNetV3Block, [16, 3, 1, 1, False, "RE"]]  # 1
  - [-1, 1, MobileNetV3Block, [24, 3, 2, 4, False, "RE"]]  # 2-P2/4 downsample
  - [-1, 1, MobileNetV3Block, [24, 3, 1, 3, False, "RE"]]  # 3

  # Stage 2: 160 -> 80 (P3)
  - [-1, 1, MobileNetV3Block, [40, 5, 2, 3, True, "RE"]]   # 4-P3/8 downsample
  - [-1, 1, MobileNetV3Block, [40, 5, 1, 3, True, "RE"]]   # 5
  - [-1, 1, MobileNetV3Block, [40, 5, 1, 3, True, "RE"]]   # 6

  # Stage 3: 80 -> 40 (P4)
  - [-1, 1, MobileNetV3Block, [80, 3, 2, 6, False, "HS"]]  # 7-P4/16 downsample
  - [-1, 1, MobileNetV3Block, [80, 3, 1, 2.5, False, "HS"]]  # 8
  - [-1, 1, MobileNetV3Block, [80, 3, 1, 2.3, False, "HS"]]  # 9
  - [-1, 1, MobileNetV3Block, [112, 3, 1, 6, True, "HS"]]  # 10
  - [-1, 1, MobileNetV3Block, [112, 3, 1, 6, True, "HS"]]  # 11

  # Stage 4: 40 -> 20 (P5)
  - [-1, 1, MobileNetV3Block, [160, 5, 2, 6, True, "HS"]]  # 12-P5/32 downsample
  - [-1, 1, MobileNetV3Block, [160, 5, 1, 6, True, "HS"]]  # 13
  - [-1, 1, MobileNetV3Block, [160, 5, 1, 6, True, "HS"]]  # 14
  - [-1, 1, SPPF, [160, 5]]  # 15

# Lightweight FPN head for pose estimation
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 11], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C2f_CBAM, [112]]  # 18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C2f_CBAM, [40]]  # 21 (P3/8-small)

  - [-1, 1, Conv, [40, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C2f_CBAM, [112]]  # 24 (P4/16-medium)

  - [-1, 1, Conv, [112, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C2f_CBAM, [160]]  # 27 (P5/32-large)

  - [[21, 24, 27], 1, Pose, [nc, kpt_shape]]  # Pose(P3, P4, P5)
