# Rune Pose Detection Model with RepVGG Backbone
# Pure 3x3 standard convolutions with strong channel interaction.
# Multi-branch training fuses to single 3x3 conv for TensorRT-friendly inference.

# Parameters
nc: 4  # number of classes (4 rune types)
kpt_shape: [8, 3]  # 8 keypoints, 3 dimensions (x, y, visibility)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 512]   # nano
  s: [0.33, 0.50, 512]   # small
  m: [0.67, 0.75, 512]   # medium

# RepVGG backbone
backbone:
  # [from, repeats, module, args]
  # Stem: /2
  - [-1, 1, RepVGGStem, [32]]               # 0-P1/2

  # Stage 1: /4
  - [-1, 2, RepVGGStage, [64, 2]]           # 1-P2/4 (n=2, s=2)

  # Stage 2: /8 (P3 output)
  - [-1, 4, RepVGGStage, [96, 2]]           # 2-P3/8 (n=4, s=2)

  # Stage 3: /16 (P4 output)
  - [-1, 6, RepVGGStage, [192, 2]]          # 3-P4/16 (n=6, s=2)

  # Stage 4: /32 (P5 output)
  - [-1, 2, RepVGGStage, [384, 2]]          # 4-P5/32 (n=2, s=2)
  - [-1, 1, SPPF, [384, 5]]                 # 5

# Lightweight FPN head for pose estimation
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]               # cat backbone P4
  - [-1, 2, C2f, [192]]                     # 8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]               # cat backbone P3
  - [-1, 2, C2f, [96]]                      # 11 (P3/8-small)

  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]               # cat head P4
  - [-1, 2, C2f, [192]]                     # 14 (P4/16-medium)

  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 5], 1, Concat, [1]]               # cat head P5
  - [-1, 2, C2f, [384]]                     # 17 (P5/32-large)

  - [[11, 14, 17], 1, Pose, [nc, kpt_shape]]  # Pose(P3, P4, P5)
