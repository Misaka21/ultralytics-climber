# Rune Pose Detection Model with ShuffleNetV2 Backbone
# Channel shuffle operations force cross-channel information exchange
# with high parameter efficiency.

# Parameters
nc: 4  # number of classes (4 rune types)
kpt_shape: [8, 3]  # 8 keypoints, 3 dimensions (x, y, visibility)
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 512]   # nano
  s: [0.33, 0.50, 512]   # small
  m: [0.67, 0.75, 512]   # medium

# ShuffleNetV2 backbone
backbone:
  # [from, repeats, module, args]
  # Stem: /4 (conv stride 2 + maxpool stride 2)
  - [-1, 1, ShuffleV2Stem, [24]]            # 0-P2/4

  # Stage 2: /8 (P3)
  - [-1, 4, ShuffleV2Stage, [116, 2]]       # 1-P3/8

  # Stage 3: /16 (P4)
  - [-1, 8, ShuffleV2Stage, [232, 2]]       # 2-P4/16

  # Stage 4: /32 (P5)
  - [-1, 4, ShuffleV2Stage, [464, 2]]       # 3-P5/32
  - [-1, 1, SPPF, [464, 5]]                 # 4

# Lightweight FPN head for pose estimation
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]               # cat backbone P4
  - [-1, 2, C2f_CBAM, [232]]                     # 7

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]               # cat backbone P3
  - [-1, 2, C2f_CBAM, [116]]                     # 10 (P3/8-small)

  - [-1, 1, Conv, [116, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]               # cat head P4
  - [-1, 2, C2f_CBAM, [232]]                     # 13 (P4/16-medium)

  - [-1, 1, Conv, [232, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]               # cat head P5
  - [-1, 2, C2f_CBAM, [464]]                     # 16 (P5/32-large)

  - [[10, 13, 16], 1, Pose, [nc, kpt_shape]]  # Pose(P3, P4, P5)
