# 大能量机关（Buff）Pose 超参数
# 适用：kpt_shape=[9,3]，关闭翻转，角点精度优先

# --------------------------
# 训练规模（基于预训练权重微调）
# --------------------------
epochs: 200
imgsz: 640
batch: 20

# --------------------------
# 优化器与学习率（微调用低 lr）
# --------------------------
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# --------------------------
# 损失权重（角点精度 → 抬高 pose）
# --------------------------
box: 7.5
cls: 0.5
dfl: 1.5
pose: 120.0
kobj: 1.0

# --------------------------
# 数据增强（保守，无翻转）
# --------------------------
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 3.0
translate: 0.05
scale: 0.3
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.2
mixup: 0.0
copy_paste: 0.0
erasing: 0.0

# --------------------------
# 训练行为
# --------------------------
close_mosaic: 100
amp: True
patience: 100

# --------------------------
# 输出配置
# --------------------------
project: runs/pose
name: buff_pose_yolo11l
exist_ok: False

# --------------------------
# 验证与可视化
# --------------------------
val: True
plots: True
save: True
