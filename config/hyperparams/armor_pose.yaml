# Armor Pose Detection Hyperparameters
# Optimized for 4-point armor plate keypoint detection

# Training Settings
epochs: 200
imgsz: 640
batch: 16

# Learning Rate
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss Gains - Optimized for precise keypoint localization
box: 7.5
cls: 0.5
dfl: 1.5
pose: 12.0      # Higher weight for accurate 4-corner detection
kobj: 1.0

# Augmentation - Conservative for armor plates
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0      # No vertical flip
fliplr: 0.5      # Horizontal flip OK
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# Training Features
close_mosaic: 10
amp: True
patience: 50

# Output
project: runs/pose
name: armor_mobilenet
exist_ok: True

# Validation
val: True
plots: True
save: True
