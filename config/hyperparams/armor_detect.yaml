# Armor Detection Hyperparameters
# For MobileNetV3-based armor plate detection (12 classes)

# Training Settings
epochs: 150
imgsz: 640
batch: 32

# Learning Rate
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss Gains - Standard for detection
box: 7.5
cls: 0.5
dfl: 1.5

# Augmentation - Standard for detection
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0      # No rotation for armor
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0      # No vertical flip
fliplr: 0.5      # Horizontal flip OK
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# Training Features
close_mosaic: 10
amp: True
patience: 50

# Output
project: runs/detect
name: armor_detect_mobilenet
exist_ok: True

# Validation
val: True
plots: True
save: True
