# RoboMaster 装甲板检测数据集配置（v4）
# 任务类型：Detect（仅框检测，不含关键点）
# 适用模型：armor-detect-mobilenet.yaml / 其他 detect 头模型

# --------------------------
# 数据集路径配置
# --------------------------
path: data/armor      # 数据集根目录（请按本机实际路径修改）
train: images         # 训练集图像目录（相对 path）
val: images           # 验证集图像目录（当前与 train 相同，可后续拆分）

# --------------------------
# 类别配置
# --------------------------
nc: 12                # 类别数（必须与 names 数量一致）

# 类别索引定义（蓝方 B*，红方 R*）
# 说明：类别索引会直接影响训练标签含义，修改时需同步标签文件
names:
  0: B1               # 蓝方 1 号装甲
  1: B2               # 蓝方 2 号装甲
  2: B3               # 蓝方 3 号装甲
  3: B4               # 蓝方 4 号装甲
  4: B5               # 蓝方 5 号装甲
  5: B7               # 蓝方哨兵装甲
  6: R1               # 红方 1 号装甲
  7: R2               # 红方 2 号装甲
  8: R3               # 红方 3 号装甲
  9: R4               # 红方 4 号装甲
  10: R5              # 红方 5 号装甲
  11: R7              # 红方哨兵装甲

# --------------------------
# 标注格式说明
# --------------------------
# YOLO Detect 单行格式：
# class_id x_center y_center width height
# 全部坐标为相对值（0~1）
# 当前 train/val 指向同一路径时，建议配合 autosplit 或手工划分避免评估偏差
