# 大符（Rune）关键点数据集配置
# 任务类型：Pose（kpt_shape=[8,3]）
# 说明：该数据集用于 8 点大符定位，包含关键点可见性维度 v。

# --------------------------
# 数据集路径配置
# --------------------------
path: /root/autodl-tmp/RM2026_buff     # 数据集根目录（请改为本机实际路径）
train: autosplit_train.txt       # 训练图像目录（相对 path）
val: autosplit_val.txt         # 验证图像目录（当前与 train 相同，可后续拆分）

# --------------------------
# 关键点定义
# --------------------------
kpt_shape: [8, 3]   # 8 个关键点，每点 3 维：(x, y, v)

# 可见性 v 约定（常用）：
# v=0: 不可见/无此点
# v=1: 可见（也可按项目约定使用 v=2）
# 对于无关键点类别，建议全部写 0 0 0

# --------------------------
# 类别定义
# --------------------------
names:
  0: r_target
  1: r_R
  2: b_target
  3: b_R


# --------------------------
# 关键点翻转映射
# --------------------------
# 若启用 fliplr，按此索引重排关键点。
# 当前设置为恒等映射，仅在你的标注定义确实水平对称时成立。
# 若符号有严格左右语义，建议训练时关闭 fliplr 或重定义 flip_idx。
flip_idx: [0, 1, 2, 3, 4, 5, 6, 7]
